server:
  port: 8080

spring:
  application:
    name: vetcare
    jackson:
      time-zone: UTC
  datasource:
    url: jdbc:postgresql://localhost:5432/vetcare
    username: admin
    password: admin123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        show_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/vetcare}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  security:
    oidc:
      client-id: ${OIDC_CLIENT_ID:vetcare-front}
    keycloak-admin:
      enabled: ${KEYCLOAK_ADMIN_SYNC_ENABLED:true}
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:vetcare}
      admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    cors:
      allowed-origins:
        - ${CORS_ORIGIN_ERP:http://localhost:5173}
        - ${CORS_ORIGIN_CLINIC:http://localhost:5174}
        - ${CORS_ORIGIN_POS:http://localhost:5175}
    jwt:
      # Legacy settings kept only while JwtService class exists; not used for authentication anymore.
      secret: "super-secret-one-key-12345678901234567890123456789012"
      access-token-minutes: 1440

  fiscal:
    ambiente: HOMOLOGACAO # HOMOLOGACAO|PRODUCAO
    uf: SP
    certificado:
      tipo: A1
      caminho: ""
      senha: ""
    nfce:
      idTokenCsc: "" # CSC Id
      csc: ""       # CSC
    emitente:
      cnpj: ""         # 14 dígitos
      ie: ""
      razaoSocial: ""
      fantasia: ""
      logradouro: ""
      numero: ""
      bairro: ""
      cMun: ""         # código IBGE do município
      xMun: ""
      cep: ""          # 8 dígitos
